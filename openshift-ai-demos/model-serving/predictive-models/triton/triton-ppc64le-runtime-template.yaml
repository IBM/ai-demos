---
# OpenShift Template for the Triton Server ServingRuntime (ppc64le).
#
# Instantiate with:
#   oc process -n <namespace> -f triton-ppc64le-runtime-template.yaml | oc apply -f -
#
# Parameters:
#   MODEL_NAME    — directory name of the model inside the model repository
#                   (must match the InferenceService name; default: fraud-detection)
#   RUNTIME_NAME  — metadata.name of the resulting ServingRuntime resource
#                   (default: triton-fraud-detection)
#
# The automation applies this via rhoai.platform.inference.apply_serving_runtime_from_template().
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/modelServingSupport: '["single"]'
  labels:
    opendatahub.io/dashboard: "true"
  name: triton-ppc64le-runtime
  namespace: redhat-ods-applications
objects:
- apiVersion: serving.kserve.io/v1alpha1
  kind: ServingRuntime
  metadata:
    annotations:
      opendatahub.io/apiProtocol: REST
      openshift.io/display-name: Triton Server ServingRuntime for KServe (ppc64le)
    labels:
      name: ${RUNTIME_NAME}
    name: ${RUNTIME_NAME}
  spec:
    containers:
    - command:
      - tritonserver
      - --model-repository=/mnt/models
      - --model-control-mode=explicit
      - --load-model=${MODEL_NAME}
      image: quay.io/powercloud/tritonserver:latest
      name: kserve-container
      ports:
      - containerPort: 8000
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
        requests:
          cpu: "2"
          memory: 8Gi
    httpDataEndpoint: port:8000
    supportedModelFormats:
    - name: python
    - autoSelect: true
      name: onnx
parameters:
- description: >
    Directory name of the model inside the model repository.
    Must match the InferenceService name (KServe mounts the model directory
    under this name). Stray directories such as .ipynb_checkpoints are ignored.
  name: MODEL_NAME
  value: fraud-detection
- description: >
    metadata.name of the resulting ServingRuntime resource.
    Each model deployment must use a unique name so that Triton runtimes
    do not overwrite each other.
  name: RUNTIME_NAME
  value: triton-fraud-detection
