apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${MODEL_NAME}-pvc
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${STORAGE_SIZE}
  storageClassName: ${STORAGE_CLASS}
---
apiVersion: v1
kind: Pod
metadata:
  name: ${MODEL_NAME}-downloader
  namespace: ${NAMESPACE}
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: downloader
      image: registry.access.redhat.com/ubi9/python-312:9.8-1783442686
      securityContext:
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          set -e

          pip install -q "huggingface_hub[hf_xet]==1.22.0" \
            --extra-index-url https://console.redhat.com/api/pypi/public-rhai/rhoai/3.5/cpu-ubi9/simple/

          set -x
          hf download $MODEL_REPO \
            --local-dir /mnt/models/$MODEL_NAME
          set +x

          echo "Model downloaded successfully."
      env:
        - name: MODEL_REPO
          value: "${MODEL_REPO}"
        - name: MODEL_NAME
          value: "${MODEL_NAME}"
        - name: HF_TOKEN
          value: "${HF_TOKEN}"
      volumeMounts:
        - name: model-storage
          mountPath: /mnt/models
  volumes:
    - name: model-storage
      persistentVolumeClaim:
        claimName: ${MODEL_NAME}-pvc
