---
apiVersion: v1
kind: Secret
metadata:
  name: techmart-db-secret
  labels:
    app: techmart-postgresql
type: Opaque
stringData:
  database-name: techmart
  database-user: techmart
  database-password: techmart123
  database-root-password: postgres123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: techmart-postgresql-pvc
  labels:
    app: techmart-postgresql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techmart-postgresql
  labels:
    app: techmart-postgresql
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: techmart-postgresql
  template:
    metadata:
      labels:
        app: techmart-postgresql
        component: database
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-name
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-root-password
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: techmart-postgresql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: techmart-postgresql
  labels:
    app: techmart-postgresql
    component: database
spec:
  selector:
    app: techmart-postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: postgresql
  type: ClusterIP
