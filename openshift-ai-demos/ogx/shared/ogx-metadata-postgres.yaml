# The Secret is the single source of truth: the database container and
# the OGX server both read it, so the two can never drift apart.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_HOST: postgres.ogx-sandbox.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ogx
  POSTGRES_USER: ogx
  POSTGRES_PASSWORD: ogx
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: registry.redhat.io/rhel9/postgresql-16
      env:
        # The image expects POSTGRESQL_*; the secret is keyed POSTGRES_* because
        # that is what the OGX server reads. secretKeyRef bridges the two names.
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DB
      ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
