[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhoai-automation"
version = "0.1.0"
description = "CLI-first automation framework for Red Hat OpenShift AI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]
# Enables generating a Triton config.pbtxt from an ONNX model when a deployment
# supplies model_path without config_path. Only needed for that path.
onnx = [
    "onnxruntime>=1.17",
]

[project.scripts]
rhoai = "rhoai.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rhoai*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
